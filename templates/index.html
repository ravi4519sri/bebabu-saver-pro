<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebabu Saver Pro</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/Bebabu Saver Pro Logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e91e63">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            background-attachment: fixed;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(233, 30, 99, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: contain;
            background: white;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.2);
            margin-bottom: 10px;
        }
        
        .logo-container h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a2e;
        }
        
        .logo-container h1 span {
            background: linear-gradient(135deg, #e91e63, #ad1457);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo-container .subtitle {
            color: #6c6c7a;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .badge-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0 22px;
        }
        
        .badge {
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        
        .badge-youtube {
            background: #ff0000;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.25);
        }
        
        .badge-starmaker {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.25);
        }
        
        .input-group {
            margin-bottom: 18px;
        }
        
        .input-group label {
            color: #2d3436;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        
        .input-group .input-wrapper {
            position: relative;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid #f0e0e8;
            background: #faf5f7;
            color: #1a1a2e;
            font-size: 14px;
            transition: 0.3s;
            outline: none;
            padding-right: 45px;
        }
        
        .input-group input:focus {
            border-color: #e91e63;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.08);
        }
        
        .input-group input::placeholder {
            color: #b2b0b8;
        }
        
        .input-group .paste-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #e91e63;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .input-group .paste-btn:hover {
            background: #ad1457;
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        
        .btn {
            flex: 1;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-mp3 {
            background: linear-gradient(135deg, #e91e63, #ad1457);
            color: white;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.3);
        }
        
        .btn-mp3:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.4);
        }
        
        .btn-mp4 {
            background: linear-gradient(135deg, #9c27b0, #e91e63);
            color: white;
            box-shadow: 0 4px 20px rgba(156, 39, 176, 0.3);
        }
        
        .btn-mp4:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(156, 39, 176, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .message {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
        }
        
        .message.success {
            display: block;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
        }
        
        .message.error {
            display: block;
            background: #fce4ec;
            border: 1px solid #f8bbd0;
            color: #c62828;
        }
        
        .message.info {
            display: block;
            background: #fff8e1;
            border: 1px solid #ffecb3;
            color: #f57f17;
        }
        
        .message .platform-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 6px;
        }
        
        .message .platform-youtube {
            background: #ff0000;
            color: white;
        }
        
        .message .platform-starmaker {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .footer {
            text-align: center;
            color: #b2b0b8;
            font-size: 11px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0e8ec;
            letter-spacing: 0.3px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }
            .logo-container h1 {
                font-size: 22px;
            }
            .logo-img {
                width: 60px;
                height: 60px;
            }
            .btn-group {
                flex-direction: column;
                gap: 10px;
            }
            .badge-container {
                gap: 8px;
            }
            .badge {
                font-size: 10px;
                padding: 4px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="logo-container">
            <img src="/static/icons/Bebabu Saver Pro Logo.png" alt="Bebabu Saver Pro Logo" class="logo-img" id="appLogo">
            <h1><span>Bebabu Saver Pro</span></h1>
            <p class="subtitle">YouTube + StarMaker Downloader</p>
        </div>

        <div class="badge-container">
            <span class="badge badge-youtube">▶ YouTube</span>
            <span class="badge badge-starmaker">⭐ StarMaker</span>
        </div>

        <div class="input-group">
            <label>🔗 Paste your YouTube or StarMaker link</label>
            <div class="input-wrapper">
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=... or https://starmaker...">
                <button class="paste-btn" id="pasteBtn">📋 Paste</button>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-mp3" id="mp3Btn">🎵 Download MP3</button>
            <button class="btn btn-mp4" id="mp4Btn">🎬 Download MP4</button>
        </div>

        <div class="message" id="message"></div>

        <div class="footer">
            © 2026 Bebabu Saver Pro. All rights reserved.
        </div>

    </div>

    <script>
        // ============================================================
        // PASTE BUTTON
        // ============================================================
        const urlInput = document.getElementById('urlInput');
        const pasteBtn = document.getElementById('pasteBtn');

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    urlInput.value = text.trim();
                    showMessage('✅ Link pasted from clipboard!', 'success');
                }
            } catch (err) {
                showMessage('❌ Unable to access clipboard. Please paste manually.', 'error');
            }
        });

        // ============================================================
        // DOWNLOAD LOGIC
        // ============================================================
        const mp3Btn = document.getElementById('mp3Btn');
        const mp4Btn = document.getElementById('mp4Btn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type, platform = null) {
            messageDiv.className = 'message ' + type;
            let platformTag = '';
            if (platform === 'youtube') {
                platformTag = '<span class="platform-tag platform-youtube">▶ YouTube</span> ';
            } else if (platform === 'starmaker') {
                platformTag = '<span class="platform-tag platform-starmaker">⭐ StarMaker</span> ';
            }
            messageDiv.innerHTML = platformTag + text;
            messageDiv.style.display = 'block';
            
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 10000);
            }
        }

        function download(format) {
            const url = urlInput.value.trim();
            if (!url) {
                showMessage('❌ Please enter a valid URL!', 'error');
                return;
            }

            let platform = 'unknown';
            if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('/shorts/')) {
                platform = 'youtube';
            } else if (url.includes('starmaker')) {
                platform = 'starmaker';
            } else {
                showMessage('❌ Only YouTube or StarMaker URLs are supported!', 'error');
                return;
            }

            mp3Btn.disabled = true;
            mp4Btn.disabled = true;

            showMessage(`⏳ ${platform.toUpperCase()} ${format.toUpperCase()} download starting... Please wait.`, 'info', platform);

            fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, format_type: format })
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        try {
                            const data = JSON.parse(text);
                            throw new Error(data.message || 'Download failed');
                        } catch {
                            throw new Error('Download failed! Please try again.');
                        }
                    });
                }
                
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = format === 'mp3' ? 'audio.mp3' : 'video.mp4';
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename="?([^"]+)"?/);
                    if (match) filename = match[1];
                }
                
                return response.blob().then(blob => {
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(downloadUrl);
                    
                    showMessage(`✅ ${format.toUpperCase()} download completed!`, 'success', platform);
                    urlInput.value = '';
                });
            })
            .catch(error => {
                showMessage(`❌ ${error.message}`, 'error');
            })
            .finally(() => {
                mp3Btn.disabled = false;
                mp4Btn.disabled = false;
            });
        }

        mp3Btn.addEventListener('click', () => download('mp3'));
        mp4Btn.addEventListener('click', () => download('mp4'));

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                mp3Btn.click();
            }
        });

        // ============================================================
        // SERVICE WORKER
        // ============================================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(() => console.log('Service Worker registration failed'));
        }

        document.getElementById('appLogo').addEventListener('error', function() {
            this.style.display = 'none';
            const container = this.parentElement;
            const fallback = document.createElement('div');
            fallback.style.fontSize = '48px';
            fallback.textContent = '🎵';
            container.insertBefore(fallback, this.nextSibling);
        });
    </script>

</body>
</html>
